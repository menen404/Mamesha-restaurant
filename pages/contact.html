            <a href="menu.html">Menu</a>

    <main>
        <section>
            <h2>Get in Touch with us!</h2>
            <p>We would love to hear from you.Please fill out this form:</p>
        </section>

        <section>
            <h2>Send us Message</h2>
            
            <form action="#" method = "post">

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label for="message">Message</label>
            <textarea name="message" id="message"  rows="3"  cols="30" required></textarea>
            <br><br>

            <input type="submit" value="Send Message">
            </form>

            <p>
                You can also email or call us directly at <br><br>
                
                Email: <a href="mailto:mamesharestaurant@gmail.com">mamesharestaurant@gmail.com</a>

                <br>

                Telephone: <a href="tel:+251911039744">+251 911039744</a>
            </p>
        </section>

    </main>
